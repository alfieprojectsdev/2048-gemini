[project]
name = "2048-gemini"
version = "0.1.0"
description = "A pedagogical 2048 game with Expectimax, Monte Carlo rollouts, headless simulation, and CV gesture controls."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mediapipe>=0.10.33",
    "numpy>=2.4.4",
    "opencv-python>=4.13.0.92",
    "pygame>=2.6.1",
    "requests>=2.33.1",
]

[project.scripts]
2048-gemini = "main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
